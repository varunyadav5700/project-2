```<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Own Notepad</title>

  <style>
    :root{
      --accent:#1cf3e5;
      --border:rgba(105, 29, 255, 0.964);
      font-family: Inter, Roboto, sans-serif;
    }

    html,body{
      height:100%;margin:0;color:rgb(112, 56, 56);overflow-x:hidden;
      background:#000;
    }

    body::before{
      content:"";
      position:fixed;inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.9) 0px, transparent 2px),
        radial-gradient(circle at 70% 80%, rgba(255,255,255,0.9) 0px, transparent 2px),
        radial-gradient(circle at 40% 60%, rgba(255,255,255,0.8) 0px, transparent 2px),
        radial-gradient(circle at 85% 25%, rgba(255,255,255,0.8) 0px, transparent 2px),
        radial-gradient(circle at 10% 90%, rgba(255,255,255,0.8) 0px, transparent 2px),
        url('https://grainy-gradients.vercel.app/noise.svg');
      background-size:4px 4px,4px 4px,4px 4px,4px 4px,4px 4px,contain;
      opacity:0.55;
      z-index:-3;
    }

    body::after{
      content:"";
      position:fixed;
      top:70px;right:90px;
      width:130px;height:130px;
      border-radius:50%;
      background:radial-gradient(circle,#ffffff,#d9d9d9,#b8b8b8);
      box-shadow:0 0 40px rgba(151, 56, 56, 0.4);
      z-index:-2;
    }

    .app{
      min-height:100vh;
      padding:40px;
      display:flex;
      flex-direction:column;
      gap:28px;
    }

    .titleBox{
      margin:auto;
      margin-top:0;
      margin-bottom:10px;
      padding:16px 36px;
      border:2px solid var(--border);
      border-radius:14px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(6px);
      box-shadow:0 0 20px rgba(227, 12, 12, 0.651);
    }
    .titleBox h1{
      margin:0;
      font-size:28px;
      color:var(--accent);
      text-align:center;
      letter-spacing:1px;
      font-weight:700;
    }

    .controls{margin-left:auto;display:flex;gap:12px;align-items:center}
    .btn{
      width:44px;height:44px;border-radius:12px;
      background:#111;border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:0.12s;
    }
    .btn:hover{transform:translateY(-3px);box-shadow:0 0 18px rgba(255,128,0,0.4)}

    .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:10px;}

    .note{
      background:#0f0f0f;border:1px solid var(--border);
      padding:14px;border-radius:12px;
      display:flex;flex-direction:column;gap:10px;
      box-shadow:0 0 26px rgba(255,120,0,0.15);
    }
    .title{font-size:15px;font-weight:600;color:white;outline:none}
    .content{font-size:14px;color:#cccccc;white-space:pre-wrap;outline:none}

    .meta{display:flex;align-items:center;justify-content:space-between;color:#777;font-size:12px;}

    .icon{width:20px;height:20px;}

    .note.enter{animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    footer{
      width:100%;text-align:center;color:#888;margin-top:40px;font-size:14px;
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="titleBox">
      <h1>YOUR OWN NOTEPAD </h1>
    </div>

    <div class="controls" style="margin-bottom:-10px;">
      <button class="btn" id="addNoteBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#ff8f1f" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="btn" id="clearAllBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#ff8f1f" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="board" class="board"></div>

  </div>

<script>
  const board = document.getElementById('board');
  const addNoteBtn = document.getElementById('addNoteBtn');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const STORAGE_KEY = 'cyberpunk_notes_final_v1';

  function createNote(data={}){
    const n = document.createElement('div');
    n.className = 'note enter';

    const title = document.createElement('div');
    title.className = 'title';
    title.contentEditable = true;
    title.innerText = data.title || '';

    const content = document.createElement('div');
    content.className = 'content';
    content.contentEditable = true;
    content.innerText = data.content || '';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const time = document.createElement('small');
    time.innerText = data.updated ? new Date(data.updated).toLocaleString() : '';

    const del = document.createElement('button');
    del.className = 'btn';
    del.innerHTML = `<svg class='icon' viewBox='0 0 24 24' fill='none'><path d='M6 6l12 12M18 6L6 18' stroke='#ff8f1f' stroke-width='2' stroke-linecap='round'/></svg>`;
    del.onclick = ()=>{ n.remove(); saveNotes(); };

    meta.appendChild(time);
    meta.appendChild(del);

    title.oninput = content.oninput = ()=>{
      time.innerText = new Date().toLocaleString();
      saveNotes();
    };

    n.appendChild(title);
    n.appendChild(content);
    n.appendChild(meta);

    return n;
  }

  function addNote(data={}){
    const n = createNote(data);
    board.prepend(n);
    n.querySelector('.title').focus();
    saveNotes();
  }

  function saveNotes(){
    const out = [];
    document.querySelectorAll('.note').forEach(n=>{
      const t = n.querySelector('.title').innerText;
      const c = n.querySelector('.content').innerText;
      if(t.trim() || c.trim()){
        out.push({title:t,content:c,updated:new Date().toISOString()});
      }
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(out));
  }

  function loadNotes(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    JSON.parse(raw).reverse().forEach(addNote);
  }

  addNoteBtn.onclick = ()=> addNote();
  clearAllBtn.onclick = ()=>{
    if(confirm('Delete all notes?')){
      localStorage.removeItem(STORAGE_KEY);
      board.innerHTML = '';
    }
  };

  loadNotes();
  if(!document.querySelector('.note')) ;
</script>
<footer style="width:100%;text-align:center;color:#888;margin-top:40px;font-size:14px;">
  made with ❤️ by Varun Yadav
</footer>

</body>
</html>
